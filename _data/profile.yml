short_bio_text_justify: false
short_bio: >-
  <p>
    Hi there! I'm <strong>Zihang Ma</strong> (written as <strong>马梓航</strong> in Chinese).
    "Ma"/"马" is my surname, which means "horse" in Chinese. "Zihang"/"梓航" is my given name.
  </p>
  <p>
    Right now, I am a senior student at <a href="https://en.tju.edu.cn/" target="_blank">Tianjin University</a>
    (<strong>TJU</strong>), majoring in
    <a href="https://come.tju.edu.cn/info/1042/1521.htm" target="_blank">Information Management and Information Systems</a>.
  </p>
  <p>
    Starting in September 2027, I will pursue a Ph.D. at the
    <a href="https://nlpr.ia.ac.cn/en/" target="_blank">National Laboratory of Pattern Recognition</a>
    (<strong>NLPR</strong>), <a href="http://english.ia.cas.cn/" target="_blank">Institute of Automation, Chinese Academy of Sciences</a>
    (<strong>CASIA</strong>).
  </p>
  <p>
    During my undergraduate studies, I was fortunate to be advised by
    <a href="http://www.icdai.org/jianye.html" target="_blank">Prof. Jianye Hao</a>.
    During my Ph.D. study, I will be advised by
    <a href="https://rhe-web.github.io/" target="_blank">Prof. Ran He</a>.
  </p>
  <p>
    My past research and engineering experiences have mainly centered on agents.
    In my Ph.D. journey, I hope to dive deeper into the foundations of large language models
    and contribute work with real impact.
  </p>

